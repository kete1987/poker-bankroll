name: Release

# - Tag vX.Y.Z (or vX.Y.Z-rc.N): publish the images with that version and create the GitHub Release.
# - Push to main: publish the "edge" images. Commits reach main only through PRs with CI green
#   (branch ruleset), so they are not tested again here.
# See docs/releasing.md.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer edge build supersedes an older one; a version build must always finish.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Third-party actions are pinned to a commit SHA (the tag is in the comment).
jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image-prefix: ${{ steps.version.outputs.image-prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          .github/scripts/release-version.sh "$REF_TYPE" "$REF_NAME" "$SHA" | tee -a "$GITHUB_OUTPUT"
          # Image names must be lowercase (forks may have uppercase owners).
          echo "image-prefix=ghcr.io/${OWNER,,}/poker-bankroll" | tee -a "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: backend
            description: REST API of poker-bankroll, a self-hosted poker bankroll manager
          - image: web
            context: frontend
            description: Web app of poker-bankroll, a self-hosted poker bankroll manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Emulation is only needed for the tiny arm64 runtime stages; the builds run natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Image tags
        env:
          IMAGE: ${{ needs.version.outputs.image-prefix }}-${{ matrix.image }}
          TAGS: ${{ needs.version.outputs.tags }}
        run: |
          {
            echo 'list<<EOF'
            for tag in $TAGS; do echo "$IMAGE:$tag"; done
            echo 'EOF'
          } | tee -a "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=poker-bankroll-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    name: GitHub Release
    needs: [version, images]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # The release may already exist if it was created from the GitHub UI.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          flags=(--generate-notes --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" "${flags[@]}"
