# poker-bankroll stack: PostgreSQL + API + web (nginx) + daily database backups.
# Only `web` is published on the host.
#
#   cp .env.example .env        # then set POSTGRES_PASSWORD
#   docker compose up -d --build   # build the images from this checkout
#   docker compose pull && docker compose up -d   # or run released images from GHCR
#
# Works as a Portainer stack too (paste this file and set the variables of .env.example).
name: poker-bankroll

services:
  db:
    image: postgres:18-alpine # keep in sync with backend TestcontainersConfiguration
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokerbankroll}
      POSTGRES_USER: ${POSTGRES_USER:-pokerbankroll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/kete1987/poker-bankroll-api:${POKER_BANKROLL_VERSION:-latest}
    build: ../backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pokerbankroll}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pokerbankroll}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/kete1987/poker-bankroll-web:${POKER_BANKROLL_VERSION:-latest}
    build: ../frontend
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

  # Daily pg_dump of the database to BACKUP_DIR on the host, with daily/weekly/monthly
  # rotation. See docs/backups.md (restore procedure included).
  backup:
    # Keep the PostgreSQL major in sync with the db image (pg_dump cannot dump a newer server).
    image: prodrigestivill/postgres-backup-local:18-alpine-d257e5d
    restart: unless-stopped
    # root by default so it can write to a folder created by Docker (see BACKUP_USER).
    user: '${BACKUP_USER:-0:0}'
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-pokerbankroll}
      POSTGRES_USER: ${POSTGRES_USER:-pokerbankroll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      # gzip-compressed plain SQL; no owner/privileges so a dump restores under any user name.
      POSTGRES_EXTRA_OPTS: -Z6 --no-owner --no-privileges
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_ON_START: 'TRUE'
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      # Port of the scheduler's status server used by the healthcheck below (8080 is also the
      # image default; set here so the healthcheck does not depend on it).
      HEALTHCHECK_PORT: '8080'
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      # The scheduler answers on 8080 inside the container (not published) and returns 503
      # when the last automatic backup failed.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:8080/']
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
