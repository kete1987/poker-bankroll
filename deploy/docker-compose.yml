# poker-bankroll stack: PostgreSQL + API + web (nginx). Only `web` is published on the host.
#
#   cp .env.example .env        # then set POSTGRES_PASSWORD
#   docker compose up -d --build   # build the images from this checkout
#   docker compose pull && docker compose up -d   # or run released images from GHCR
#
# Works as a Portainer stack too (paste this file and set the variables of .env.example).
name: poker-bankroll

services:
  db:
    image: postgres:18-alpine # keep in sync with backend TestcontainersConfiguration
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokerbankroll}
      POSTGRES_USER: ${POSTGRES_USER:-pokerbankroll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/kete1987/poker-bankroll-api:${POKER_BANKROLL_VERSION:-latest}
    build: ../backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pokerbankroll}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pokerbankroll}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/kete1987/poker-bankroll-web:${POKER_BANKROLL_VERSION:-latest}
    build: ../frontend
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
