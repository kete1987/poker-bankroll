# Proxy settings shared by every location that passes requests to the API (included from
# default.conf.template). They live in one file because nginx only inherits proxy_set_header
# into a location that sets none of its own: a location adding one would lose all of these.

# HTTP/1.1 to the backend, without passing on the client's Connection header.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $client_proto;
proxy_set_header X-Forwarded-Host $client_host;
proxy_set_header X-Forwarded-Port $client_port;

# Room for CSV imports and for restoring a backup (32 MB at most), and time: a large file
# takes longer than the default minute.
client_max_body_size 40m;
proxy_read_timeout 300s;
