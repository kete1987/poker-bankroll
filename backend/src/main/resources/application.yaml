# Defaults target the development database of deploy/docker-compose.dev.yml (localhost:5433).
# Override with standard Spring environment variables, e.g.
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, SERVER_PORT.
spring:
  application:
    name: poker-bankroll-api
  datasource:
    url: jdbc:postgresql://localhost:5433/pokerbankroll
    username: pokerbankroll
    password: pokerbankroll
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: en
    locale-resolver: accept-header

server:
  port: 8080
  # Everything (API, actuator, OpenAPI) lives under /api, which is what nginx proxies.
  servlet:
    context-path: /api
  shutdown: graceful
  # Runs behind the nginx of the web container: honour its X-Forwarded-* headers
  # (only from private-network proxies, Tomcat's default).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# API docs are part of the product (the frontend types are generated from them), so they stay
# enabled in every environment. The app is meant for a trusted LAN (see README).
springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

poker-bankroll:
  # Exchange rates of the European Central Bank, downloaded from Frankfurter (https://frankfurter.dev,
  # free, no key) to show amounts of several currencies together. The API needs outgoing internet
  # access to api.frankfurter.dev; without it everything works, with the rates already there and the
  # ones typed by hand. POKER_BANKROLL_EXCHANGE_RATES_ENABLED=false turns the downloads off.
  exchange-rates:
    enabled: true
    # Base address of the Frankfurter API (v2), e.g. that of a self-hosted Frankfurter.
    url: https://api.frankfurter.dev/v2
    # Every day after the ECB publishes (around 16:00 CET), in this time zone.
    cron: "0 0 17 * * *"
    zone: Europe/Madrid
    # Longest wait for the connection and for each answer of the service.
    timeout: 30s
