# Errores en una fila de un fichero importado (clave = import.row.<código>).
import.row.COLUMN_COUNT=La fila no tiene tantos valores como columnas la cabecera.
import.row.REQUIRED=El valor es obligatorio.
import.row.INVALID_DATE="{0}" no es una fecha: escríbela como 2026-01-31.
import.row.INVALID_TIME="{0}" no es una hora: escríbela como 21:30.
import.row.INVALID_NUMBER="{0}" no es un importe: escríbelo como 1234.56, sin símbolos.
import.row.INVALID_INTEGER="{0}" no es un número entero.
import.row.INVALID_BOOLEAN="{0}" no es true ni false.
import.row.INVALID_GAME_TYPE="{0}" no es un tipo de partida: TOURNAMENT, SIT_AND_GO o CASH.
import.row.INVALID_MODALITY="{0}" no es una modalidad: NLHE o PLO.
import.row.ROOM_NEEDS_CURRENCY=La sala {0} no existe: indica su moneda en la columna "currency" para crearla.
import.row.ROOM_CURRENCY_MISMATCH=La sala {0} está en {1}, no en {2}.

