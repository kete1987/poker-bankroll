# Where a backup file cannot be read (key = backup.where.<what>) and what is wrong in its content
# (key = backup.problem.<code>).
backup.where.line=line {0}
backup.where.value=in {0}
backup.problem.REQUIRED=A value is required.
backup.problem.DUPLICATE_ID=The id {0} is repeated.
backup.problem.DUPLICATE_EXCHANGE_RATE=There is already a rate of {0} on {1}.
backup.problem.VARIANT_CODE_OR_NAME=A variant has either a code (built-in) or a name (defined by the user).
backup.problem.UNKNOWN_BUILT_IN_VARIANT=This version of poker-bankroll has no built-in variant {0} for that game type.

# Errors in a row of an imported file (key = import.row.<code>).
import.row.COLUMN_COUNT=The row does not have as many values as the header has columns.
import.row.REQUIRED=A value is required.
import.row.INVALID_DATE="{0}" is not a date: write it as 2026-01-31.
import.row.INVALID_TIME="{0}" is not a time: write it as 21:30.
import.row.INVALID_NUMBER="{0}" is not an amount: write it as 1234.56, without symbols.
import.row.INVALID_INTEGER="{0}" is not a whole number.
import.row.INVALID_BOOLEAN="{0}" is neither true nor false.
import.row.INVALID_GAME_TYPE="{0}" is not a game type: TOURNAMENT, SIT_AND_GO or CASH.
import.row.INVALID_MODALITY="{0}" is not a modality: NLHE or PLO.
import.row.ROOM_NEEDS_CURRENCY=The room {0} does not exist: give its currency in the column "currency" to create it.
import.row.ROOM_CURRENCY_MISMATCH=The room {0} is in {1}, not in {2}.

# Messages of the validation constraints defined by the application (key = annotation name).
