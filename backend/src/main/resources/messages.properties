TicketDescriptionNeedsValue=A ticket description needs a ticket prize value.
InPlayGameHasNoResult=Not allowed while the game is in play: finish it to set its result.
RoomOrCurrency=Give either a room or, for a movement that belongs to no room, a currency.
MovementAmountSign=The amount must be greater than zero; only an adjustment can be negative.
TagName=A tag has from 1 to 40 characters and no commas or semicolons.

